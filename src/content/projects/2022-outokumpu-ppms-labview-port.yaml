description: >
  Porting an old LabVIEW program containing analysis and calculation tools for
  steel production to C#. Objective: facilitate Outokumpu's ability to easily
  maintain and further develop their own systems, by removing hard-to-maintain
  LabVIEW programs. The main challenge was building robust test benches to ensure
  consistent and equivalent behavior in both programs.
